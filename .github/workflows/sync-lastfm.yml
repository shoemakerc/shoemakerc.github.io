name: Sync Last.fm

on:
  schedule:
    # GitHub starts scheduled runs hours late when it's busy, and sometimes
    # skips them. So the first run is early, to land by morning even if it
    # starts hours late, and the second catches whatever the first missed,
    # late-night listening included. Both come before the Goodreads syncs.
    - cron: "47 7 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-lastfm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is when the job starts, not when the run was
          # queued, so a run that waited behind another one syncs on top of
          # that one's snapshot instead of conflicting with it.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Skips itself, leaving the snapshot alone, until the secret exists.
      - run: node scripts/sync-lastfm.mjs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: Commit snapshot and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/lastfm.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Listening unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Last.fm listening"
          git pull --rebase
          git push
          # Pushes made with the workflow token don't trigger other workflows,
          # so start the deploy explicitly.
          gh workflow run deploy.yml --ref master
