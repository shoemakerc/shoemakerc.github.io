name: Sync sports

on:
  schedule:
    # GitHub starts scheduled runs hours late when it's busy, and sometimes
    # skips them. So the first run is early, to land by morning even if it
    # starts hours late; the second, once last night's West Coast games are
    # surely final, catches whatever the first missed. A run with nothing new
    # to sync commits nothing.
    - cron: "27 7 * * *"
    - cron: "27 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-sports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is when the job starts, not when the run was
          # queued, so a run that waited behind another one syncs on top of
          # that one's snapshot instead of conflicting with it.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/sync-sports.mjs
      - name: Commit snapshot and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/sports.json
          if git diff --cached --quiet; then
            echo "Records unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Minnesota sports"
          git pull --rebase
          git push
          # Pushes made with the workflow token don't trigger other workflows,
          # so start the deploy explicitly.
          gh workflow run deploy.yml --ref master
