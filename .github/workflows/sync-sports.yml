name: Sync sports

on:
  schedule:
    - cron: "27 10 * * *" # daily, once last night's West Coast games are final
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-sports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/sync-sports.mjs
      - name: Commit snapshot and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content/sports.json
          if git diff --cached --quiet; then
            echo "Records unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Minnesota sports"
          git pull --rebase
          git push
          # Pushes made with the workflow token don't trigger other workflows,
          # so start the deploy explicitly.
          gh workflow run deploy.yml --ref master
